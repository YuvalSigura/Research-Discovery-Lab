name: Research archive validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - name: Check historical registry and source records were not lost
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_registry_nonloss.py --base "$BASE_SHA"
      - run: python tools/validate_archive.py
      - run: python tools/validate_registry.py
      - run: python tools/validate_publisher_sources.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
