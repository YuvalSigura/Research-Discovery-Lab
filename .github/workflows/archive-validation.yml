name: Research archive validation
on:
  push:
    paths: ["research/**", "registry/**", "schemas/**", "ontology/**", "tools/**", "tests/**", "requirements-validation.txt", "research_engine/**", ".github/workflows/archive-validation.yml"]
  pull_request:
    paths: ["research/**", "registry/**", "schemas/**", "ontology/**", "tools/**", "tests/**", "requirements-validation.txt", ".github/workflows/archive-validation.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - run: python tools/validate_archive.py
      - run: python tools/validate_registry.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
